name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the latest run per branch/PR needs to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    # Obviously-fake, non-secret configuration. CI must never need production secrets:
    # every external system is mocked in unit tests and network-blocked in e2e tests.
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      PGSSLMODE: disable
      RESEND_API_KEY: re_test_dummy_key
      EMAIL_FROM: "531 Workshop <test@example.test>"
      CONTACT_TO_EMAIL: owner@example.test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SHOPIFY_DOMAIN: test-shop.myshopify.com
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: test_storefront_token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / API tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
